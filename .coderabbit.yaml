# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_instructions:
    - path: "src/**/*.{ts,tsx,js,jsx}"
      instructions: |
        Apply docs/code-guide.md to every changed line.
        Report each violation of an explicit rule in docs/code-guide.md.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "docs/code-guide.md"
        applyTo: "src/**/*.{ts,tsx,js,jsx}"
      - files: "docs/unit-testing.md"
        applyTo: "src/**/*.test.{ts,tsx,js,jsx}"
      - files: "docs/Playwright-e2e-test-automation-guidelines.md"
        applyTo: "playwright/**/*.{ts,tsx}"
      - files: "docs/Playwright-e2e-test-automation-faq.md"
        applyTo: "playwright/**/*.{ts,tsx}"
      - files: "docs/contributing.md"
        applyTo: "src/**/*.{ts,tsx,js,jsx}"
      - files: "docs/contributing.md"
        applyTo: "playwright/**/*.{ts,tsx}"
      - files: "openapi/README.md"
        applyTo: "src/types/**/*.{ts,tsx}"
